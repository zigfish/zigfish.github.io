<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - Garment Factory</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: #111;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .code { font-size: 120px; font-weight: 700; color: #c4a265; line-height: 1; letter-spacing: 8px; }
    .title { font-size: 20px; font-weight: 500; margin: 16px 0 8px; letter-spacing: 3px; text-transform: uppercase; }
    .subtitle { font-size: 14px; color: #888; margin-bottom: 40px; }
    .btn {
      display: inline-block;
      padding: 12px 32px;
      background: #c4a265;
      color: #111;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: background 0.25s;
    }
    .btn:hover { background: #fff; }
  </style>
</head>
<body>
  <div>
    <div class="code">404</div>
    <p class="title">Page Not Found / 页面未找到</p>
    <p class="subtitle">The page you are looking for does not exist or has been moved.</p>
    <a href="/" class="btn">Back to Home / 返回首页</a>
  </div>
</body>
</html>
